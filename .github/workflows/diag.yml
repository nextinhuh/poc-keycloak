name: diag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ultimas linhas do log do container (task mais recente stopped)
        run: |
          TASK_ID=$(aws ecs list-tasks --cluster poc-mtls-ECS --family poc-mtls-keycloak --desired-status STOPPED --query 'taskArns[-1]' --output text | awk -F/ '{print $NF}')
          echo "task: $TASK_ID"
          aws logs get-log-events \
            --log-group-name /ecs/poc-mtls-keycloak \
            --log-stream-name "keycloak/keycloak/${TASK_ID}" \
            --limit 100 --output text --query 'events[*].message' 2>&1 || echo "stream nao encontrado com esse nome, tentando achar"
          echo "--- streams disponiveis ---"
          aws logs describe-log-streams --log-group-name /ecs/poc-mtls-keycloak \
            --order-by LastEventTime --descending --limit 5 \
            --query 'logStreams[].logStreamName' --output json
