name: diag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Tasks atuais (running e stopped) do keycloak
        run: |
          echo "=== RUNNING ==="
          ARNS=$(aws ecs list-tasks --cluster poc-mtls-ECS --family poc-mtls-keycloak --desired-status RUNNING --query 'taskArns' --output text)
          [ -n "$ARNS" ] && aws ecs describe-tasks --cluster poc-mtls-ECS --tasks $ARNS \
            --query 'tasks[].{td:taskDefinitionArn,lastStatus:lastStatus,healthStatus:healthStatus,createdAt:createdAt}' --output json
          echo "=== STOPPED (mais recentes) ==="
          ARNS=$(aws ecs list-tasks --cluster poc-mtls-ECS --family poc-mtls-keycloak --desired-status STOPPED --query 'taskArns' --output text)
          [ -n "$ARNS" ] && aws ecs describe-tasks --cluster poc-mtls-ECS --tasks $ARNS \
            --query 'tasks[].{td:taskDefinitionArn,stoppedAt:stoppedAt,stoppedReason:stoppedReason,exitCode:containers[0].exitCode}' --output json

      - name: Eventos recentes do service
        run: |
          aws ecs describe-services --cluster poc-mtls-ECS --services poc-mtls-keycloak \
            --query 'services[0].events[:8]' --output json
