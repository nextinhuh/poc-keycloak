name: diag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: ECS service network config + rollout
        run: |
          aws ecs describe-services --cluster poc-mtls-ECS --services poc-mtls-keycloak \
            --query 'services[0].{status:status,running:runningCount,desired:desiredCount,taskDef:taskDefinition,networkConfig:deployments[0].networkConfiguration,rollout:deployments[0].rolloutState}' \
            --output json

      - name: Target group health (keycloak-admin-tg)
        run: |
          TG_ARN=$(aws elbv2 describe-target-groups --names poc-mtls-keycloak-admin-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
          aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --output json

      - name: ENIs no security group antigo (deveria estar vazio agora)
        run: |
          aws ec2 describe-network-interfaces --filters Name=group-id,Values=sg-028a6208d34ea90e1 \
            --query 'NetworkInterfaces[].{Id:NetworkInterfaceId,Status:Status}' --output json
