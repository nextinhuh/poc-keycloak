name: diag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: ENIs no SG antigo (com detalhe completo)
        run: |
          aws ec2 describe-network-interfaces --filters Name=group-id,Values=sg-028a6208d34ea90e1 --output json

      - name: Outros security groups que referenciam o antigo como origem
        run: |
          aws ec2 describe-security-groups \
            --filters "Name=egress.ip-permission.group-id,Values=sg-028a6208d34ea90e1" \
            --output json
          aws ec2 describe-security-groups \
            --filters "Name=ip-permission.group-id,Values=sg-028a6208d34ea90e1" \
            --output json

      - name: Listeners existentes no ALB
        run: |
          ALB_ARN=$(aws elbv2 describe-load-balancers --names poc-mtls-shared-alb --query 'LoadBalancers[0].LoadBalancerArn' --output text)
          echo "ALB: $ALB_ARN"
          aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --output json
