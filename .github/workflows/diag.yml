name: diag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ultimas tasks STOPPED do keycloak (motivo da falha)
        run: |
          ARNS=$(aws ecs list-tasks --cluster poc-mtls-ECS --family poc-mtls-keycloak --desired-status STOPPED --query 'taskArns' --output text)
          aws ecs describe-tasks --cluster poc-mtls-ECS --tasks $ARNS \
            --query 'tasks[].{taskDef:taskDefinitionArn,stoppedAt:stoppedAt,stoppedReason:stoppedReason,containers:containers[].{reason:reason,exitCode:exitCode}}' \
            --output json

      - name: Eventos recentes do service (ultimos 10)
        run: |
          aws ecs describe-services --cluster poc-mtls-ECS --services poc-mtls-keycloak \
            --query 'services[0].events[:10]' --output json
