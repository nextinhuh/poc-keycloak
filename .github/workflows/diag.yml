name: diag

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Qual task tem essa ENI (eni-0e2af6d923432dff7)
        run: |
          aws ecs list-tasks --cluster poc-mtls-ECS --query 'taskArns' --output text | tr '\t' '\n' > /tmp/all-tasks.txt
          cat /tmp/all-tasks.txt
          echo "--- detalhe de cada uma ---"
          while read -r t; do
            [ -z "$t" ] && continue
            aws ecs describe-tasks --cluster poc-mtls-ECS --tasks "$t" \
              --query 'tasks[0].{taskArn:taskArn,group:group,lastStatus:lastStatus,taskDefinition:taskDefinitionArn,eni:attachments[0].details[?name==`networkInterfaceId`].value|[0]}' \
              --output json
          done < /tmp/all-tasks.txt

      - name: Network config atual do service keycloak
        run: |
          aws ecs describe-services --cluster poc-mtls-ECS --services poc-mtls-keycloak \
            --query 'services[0].{taskDef:taskDefinition,networkConfig:networkConfiguration,deployments:deployments[].{td:taskDefinition,desired:desiredCount,running:runningCount,status:status}}' \
            --output json
