name: fix-service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Parar a task antiga (rev 8) presa - desiredCount=0 ha mais de 1h
        run: |
          aws ecs stop-task --cluster poc-mtls-ECS \
            --task 73a7270ce5de46cfaaccca0bdae21d09 \
            --reason "orfa apos rollback do circuit breaker - limpeza manual"

      - name: Aguardar a task parar de vez
        run: |
          aws ecs wait tasks-stopped --cluster poc-mtls-ECS --tasks 73a7270ce5de46cfaaccca0bdae21d09

      - name: Confirmar que a ENI do SG antigo foi liberada
        run: |
          aws ec2 describe-network-interfaces --filters Name=group-id,Values=sg-028a6208d34ea90e1 --output json
