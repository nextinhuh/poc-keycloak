name: fix-service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET_PREFIX: poc-mtls-tfstate

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Resolve state bucket name
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "TF_STATE_BUCKET=${TF_STATE_BUCKET_PREFIX}-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=keycloak/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Importar o listener 8443 (ja existe na AWS, faltava no state)
        working-directory: terraform
        env:
          TF_VAR_allowed_admin_cidr: ${{ vars.ALLOWED_ADMIN_CIDR }}
        run: |
          terraform import -lock=false \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=unused" \
            -var="enable_mtls_listener=true" \
            -var="root_ca_bucket_name=poc-mtls-root-ca-273164497089" \
            'aws_lb_listener.mtls[0]' \
            arn:aws:elasticloadbalancing:us-east-1:273164497089:listener/app/poc-mtls-shared-alb/930aff2f68543987/4d8e98389d22b013
