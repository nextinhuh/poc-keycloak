name: fix-service

# Workflow temporario: recria SO o aws_ecs_service.keycloak isoladamente
# (adicionar load_balancer a um service que nunca teve exige destroy+create -
# a API da AWS nao suporta update in-place disso). Feito assim, sozinho, pra
# nao competir com o destroy do security group orfao no mesmo apply (que
# travava esperando a ENI da task antiga soltar o SG). Depois de rodar isso
# com sucesso, o deploy.yml normal roda limpo e apaga o SG. Apagar este
# arquivo depois de usado.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET_PREFIX: poc-mtls-tfstate

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Resolve state bucket name
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "TF_STATE_BUCKET=${TF_STATE_BUCKET_PREFIX}-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=keycloak/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply -target=aws_ecs_service.keycloak
        working-directory: terraform
        env:
          TF_VAR_allowed_admin_cidr: ${{ vars.ALLOWED_ADMIN_CIDR }}
        run: |
          terraform apply -auto-approve -target=aws_ecs_service.keycloak \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=ae79bd81" \
            -var="enable_mtls_listener=true" \
            -var="root_ca_bucket_name=poc-mtls-root-ca-273164497089"
