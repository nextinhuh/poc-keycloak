name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_mtls_listener:
        description: "Ativar o listener mTLS/trust store (so depois que o poc-certificate ja publicou o root_ca.crt)"
        type: boolean
        default: false
      root_ca_bucket_name:
        description: "Nome do bucket S3 do root_ca.crt (output do poc-certificate)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: poc-mtls
  ECR_REPO_NAME: poc-mtls-keycloak
  TF_STATE_BUCKET_PREFIX: poc-mtls-tfstate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DEBUG TEMPORARIO - remover depois de diagnosticar o erro de OIDC.
      # So imprime sub/aud do token (nao e segredo), pra comparar com a trust
      # policy da IAM role.
      - name: Debug - decode OIDC token claims
        run: |
          RESPONSE=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          JWT=$(echo "$RESPONSE" | jq -r .value)
          echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Create ECR repo if it does not exist (idempotent)
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPO_NAME"

      - name: Build, tag and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:8}"
          docker build -t "$REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3

      - name: Resolve state bucket name and bootstrap it (idempotent)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${TF_STATE_BUCKET_PREFIX}-${ACCOUNT_ID}"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=keycloak/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_allowed_admin_cidr: ${{ vars.ALLOWED_ADMIN_CIDR }}
          ENABLE_MTLS_LISTENER: ${{ github.event.inputs.enable_mtls_listener || 'false' }}
          ROOT_CA_BUCKET_NAME: ${{ github.event.inputs.root_ca_bucket_name || '' }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${IMAGE_TAG}" \
            -var="enable_mtls_listener=${ENABLE_MTLS_LISTENER}" \
            -var="root_ca_bucket_name=${ROOT_CA_BUCKET_NAME}"
